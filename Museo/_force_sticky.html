<!DOCTYPE html><html><head><meta charset="utf-8">
<style>html,body,iframe{margin:0;padding:0;width:100%;height:100%;border:0;}</style>
</head><body>
<iframe src="vetrine.html" id="f"></iframe>
<script>
document.getElementById('f').addEventListener('load', () => {
    setTimeout(() => {
        const w = document.getElementById('f').contentWindow;
        const d = document.getElementById('f').contentDocument;
        const hero = d.querySelector('.mappa-hero');
        if (hero) hero.classList.add('is-sticky');
        w.scrollTo(0, 600);
    }, 1500);
});
</script>
</body></html>
