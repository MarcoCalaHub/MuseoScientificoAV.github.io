        let vetrinaCorrente = null;

        function mostraVetrina(id) {
            const vetrina = vetrine[id];
            if (!vetrina) {
                alert('Vetrina non trovata!');
                return;
            }

            vetrinaCorrente = id;

            document.getElementById('vetrina-title').textContent = vetrina.nome;
            document.getElementById('vetrina-description').textContent = vetrina.descrizione;

            const infoBox = document.getElementById('info-display');
            infoBox.classList.add('active');

            // Scroll alla info box
            infoBox.scrollIntoView({
                behavior: 'smooth',
                block: 'nearest'
            });
        }

        function apriPaginaVetrina() {
            if (!vetrinaCorrente) {
                alert('Nessuna vetrina selezionata!');
                return;
            }

            const vetrina = vetrine[vetrinaCorrente];
            // Apre il file vetrine.html all'ancora della vetrina specifica
            window.open('vetrine.html#' + vetrina.anchor, '_blank');
        }

        // Aggiungi effetto hover sulle aree
        document.addEventListener('DOMContentLoaded', function() {
            const areas = document.querySelectorAll('area');
            areas.forEach(area => {
                area.addEventListener('mouseenter', function() {
                    this.style.cursor = 'pointer';
                });
            });
        });
