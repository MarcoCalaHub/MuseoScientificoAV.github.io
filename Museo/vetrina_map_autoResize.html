        const wrap = document.getElementById('mapWrap');

        function render() {
            wrap.querySelectorAll('.hotspot').forEach(el => el.remove());
            const rect = wrap.getBoundingClientRect();
            const scaleX = rect.width / originalW;
            const scaleY = rect.height / originalH;
            items.forEach(item => {
                const a = document.createElement('a');
                a.className = 'hotspot';
                a.href = item.href;
                a.title = item.id;
                a.style.left = (item.x * scaleX) + 'px';
                a.style.top = (item.y * scaleY) + 'px';
                a.style.width = (item.w * scaleX) + 'px';
                a.style.height = (item.h * scaleY) + 'px';
                a.setAttribute('aria-label', item.id);
                wrap.appendChild(a);
            });
        }
        window.addEventListener('load', render);
        window.addEventListener('resize', render);
